site_name: Documentacion Clickie
site_description: Manual operativo de Clickie generado desde Markdown
site_url: https://clickiespa.github.io/docv4/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: es

nav:
  - Inicio: index.md
  - Conceptos:
      - Introduccion: conceptos/index.md
      - Metricas y formulas: conceptos/metricas.md
      - Selector de metricas: conceptos/selector.md
  - Analisis:
      - Visor de datos: analisis/visor-datos.md
      - Paneles y reportes: analisis/paneles.md
  - Automatizacion:
      - Monitoreos: automatizacion/monitoreos.md
  - Modelado:
      - Gemelos digitales: modelado/gemelos-digitales.md
  - Organizacion:
      - Activos: organizacion/activos.md
  - Configuracion:
      - Configuracion de cuenta: configuracion/cuenta.md
      - Datos y fuentes: configuracion/datos-y-fuentes.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
