site_name: Documentación Clickie
site_description: Manual operativo de Clickie generado desde Markdown
site_url: https://clickiespa.github.io/docv4/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: es

nav:
  - Inicio: index.md
  - Conceptos:
      - Introducción: conceptos/index.md
      - Métricas y fórmulas: conceptos/metricas.md
      - Selector de métricas: conceptos/selector.md
  - Análisis:
      - Visor de datos: analisis/visor-datos.md
      - Paneles y reportes: analisis/paneles.md
  - Automatización:
      - Monitoreos: automatizacion/monitoreos.md
  - Modelado:
      - Gemelos digitales: modelado/gemelos-digitales.md
  - Organización:
      - Activos: organizacion/activos.md
  - Configuración:
      - Configuración de cuenta: configuracion/cuenta.md
      - Datos y fuentes: configuracion/datos-y-fuentes.md
      - Boletines:
          - Vista general: configuracion/boletines.md
          - Bloques de contenido: configuracion/boletines-bloques.md
          - Grupos de destinatarios: configuracion/boletines-grupos.md
          - Plantillas: configuracion/boletines-plantillas.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
