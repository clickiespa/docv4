name: Docs Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/sync_to_gdocs.py"
      - "mkdocs.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  build_and_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        run: mkdocs build --strict

      - name: Validate Google Docs secrets
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_DOC_ID}" ]; then
            echo "::error::Missing required secret: GOOGLE_DOC_ID"
            exit 1
          fi

          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::Missing required secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          python - <<'PY'
          import base64
          import json
          import os
          import sys

          raw = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"].strip()

          def is_valid_json(text: str) -> bool:
              try:
                  json.loads(text)
                  return True
              except json.JSONDecodeError:
                  return False

          if is_valid_json(raw):
              sys.exit(0)

          try:
              decoded = base64.b64decode(raw, validate=True).decode("utf-8")
          except Exception:
              decoded = ""

          if is_valid_json(decoded):
              sys.exit(0)

          print("::error::GOOGLE_SERVICE_ACCOUNT_JSON must be valid JSON or Base64-encoded JSON")
          sys.exit(1)
          PY

      - name: Sync markdown to Google Docs
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DOCS_DIR: docs
          MKDOCS_CONFIG: mkdocs.yml
        run: python scripts/sync_to_gdocs.py
