name: Docs Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/sync_to_gdocs.py"
      - "mkdocs.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  build_and_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        run: mkdocs build --strict

      - name: Write Google credentials file
        run: |
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/google-sa.json

      - name: Sync markdown to Google Docs
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/google-sa.json
          DOCS_DIR: docs
          MKDOCS_CONFIG: mkdocs.yml
        run: python scripts/sync_to_gdocs.py
